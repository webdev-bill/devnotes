; Real-world photos routinely exceed PHP's stock 2M default for
; upload_max_filesize, which silently rejects the upload before it ever
; reaches Laravel's routing or validation at all -- surfaces as Laravel's
; generic built-in "The :attribute failed to upload." message (from
; lang/en/validation.php's "uploaded" key), easy to mistake for an app bug
; rather than a PHP config gap. 6M gives headroom above the app's own 5MB
; (max:5120) validation limit for multipart framing overhead.
upload_max_filesize = 6M

; Already PHP's stock default -- pinned explicitly (not left implicit) so it
; can't silently drift if a future base image ever changes its own default.
; Must stay >= upload_max_filesize.
post_max_size = 8M

; PHP's stock 128M default was not enough to decode+re-encode a real phone
; photo, even with ImageUploadService fixed to scale down before orienting
; (see that file's comments) -- empirically confirmed: a real 4624x2080
; JPEG measured ~58MB peak under the fixed code order, comfortably under
; 128M, but an extreme 8000x6000 (48MP) source still measured ~211MB. 256M
; keeps solid headroom above a normal phone photo while leaving margin for
; an unusually large one, without approaching the whole Droplet's 1GB RAM.
; See docs/server-setup-runbook.md if a much larger photo ever needs this
; raised further.
memory_limit = 256M

; Without these two, a PHP fatal error (this OOM crash included) is
; completely invisible. Confirmed against the stock php:8.4-fpm base image
; itself, not just this build: log_errors defaults to Off, and error_log is
; unset. Even with log_errors on, a worker's own stdout/stderr output
; doesn't forward to `docker logs` by default under php-fpm (unlike plain
; CLI) unless something explicit routes it there. storage/logs/laravel.log
; staying empty is doubly expected on top of that -- a fatal this severe
; bypasses Laravel's exception handler entirely; it's not a catchable PHP
; Exception. /proc/self/fd/2 is the standard containerized-PHP fix: every
; worker writes directly to its own process's real stderr file descriptor,
; which supervisord.conf already redirects to /dev/stderr for php-fpm, so
; this reaches `docker compose logs backend` with no other plumbing needed.
log_errors = On
error_log = /proc/self/fd/2
