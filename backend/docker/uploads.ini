; Real-world photos routinely exceed PHP's stock 2M default for
; upload_max_filesize, which silently rejects the upload before it ever
; reaches Laravel's routing or validation at all -- surfaces as Laravel's
; generic built-in "The :attribute failed to upload." message (from
; lang/en/validation.php's "uploaded" key), easy to mistake for an app bug
; rather than a PHP config gap. 6M gives headroom above the app's own 5MB
; (max:5120) validation limit for multipart framing overhead.
upload_max_filesize = 6M

; Already PHP's stock default -- pinned explicitly (not left implicit) so it
; can't silently drift if a future base image ever changes its own default.
; Must stay >= upload_max_filesize.
post_max_size = 8M
