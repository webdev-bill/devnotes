server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # No http {} block exists in this file (it's included into the base
    # image's own nginx.conf as the single server block) — set here rather
    # than at http level, which is fine since there's only ever one vhost.
    # Suppresses the version number from the "server" response header
    # (stays "nginx", drops the "/1.x.y" — nginx never fully removes the
    # header itself, only the version string).
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block access to dotfiles (.env, .git, etc.) if any ever end up under
    # the document root — defense in depth, not the only thing protecting them.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
