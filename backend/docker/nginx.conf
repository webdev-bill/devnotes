server {
    listen 8000;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # No http {} block exists in this file (it's included into the base
    # image's own nginx.conf as the single server block) — set here rather
    # than at http level, which is fine since there's only ever one vhost.
    # Suppresses the version number from the "server" response header
    # (stays "nginx", drops the "/1.x.y" — nginx never fully removes the
    # header itself, only the version string).
    server_tokens off;

    # HTTP/2 must stay OFF here. This nginx is internal-only: it publishes no
    # port, and Traefik (the only container that does) terminates TLS and
    # HTTP/2 at the edge, then talks plain HTTP/1.1 to this container.
    # CVE-2026-123007 and CVE-2026-123633 (critical, unauthenticated RCE,
    # fixed in nginx 1.30.7 / 1.31.9) both need HTTP/2 enabled in nginx, so
    # keeping it off removes that whole class of bug even on an unpatched
    # image. HTTP/2 is already off by default; this line makes that a
    # deliberate, visible decision that nobody can quietly undo. The
    # standalone directive needs nginx >= 1.25.1 (Debian trixie ships
    # 1.26.3). See docs/server-setup-runbook.md, 2026-11-22.
    http2 off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Block access to dotfiles (.env, .git, etc.) if any ever end up under
    # the document root — defense in depth, not the only thing protecting them.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
