<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>devnotes</title>
    <!-- STATIC_META_TAGS_START -->
    <!-- Injected at production build time by scripts/inject-meta.mjs from
         SiteSettings, so a headless-Chrome-based checker tool (a completely
         standard browser UA — no UA heuristic can catch it, see
         docs/server-setup-runbook.md) still sees correct site-wide OG/meta
         tags on the very first byte, with no client-side JS required. Only
         a build-time bake, not per-request: stays empty here in the
         source template and in any build that doesn't set SITE_BASE_URL
         (local dev). Per-post overrides are NOT baked in here — those still
         only reach named social crawlers via the existing bot-preview path. -->
    <!-- STATIC_META_TAGS_END -->
    <script>
      // Runs before React mounts so there's no flash of the wrong theme on
      // load. Same storage key and resolution order as ThemeContext — keep
      // the two in sync if either changes.
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          // localStorage/matchMedia unavailable (rare) — fall back to light,
          // same as the no-preference default everywhere else.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
