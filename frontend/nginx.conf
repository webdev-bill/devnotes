# Case-insensitive match against known link-preview/crawler User-Agents.
# Social crawlers (Facebook, Twitter, Slack, Discord, ...) do not execute
# JavaScript, so they'd otherwise see the SPA's near-empty index.html shell
# with no meta/OG tags — this map drives the bot-only dispatch below.
# Googlebot/Bingbot are deliberately NOT in this list: they execute JS
# reasonably well today, so they get the normal SPA + client-side
# react-helmet-async tags, same as a real browser. See
# docs/server-setup-runbook.md for the full reasoning.
map $http_user_agent $is_bot_preview {
    default 0;
    ~*facebookexternalhit 1;
    ~*Twitterbot          1;
    ~*Slackbot            1;
    ~*Discordbot          1;
    ~*LinkedInBot         1;
    ~*WhatsApp            1;
    ~*TelegramBot         1;
    ~*Pinterest           1;   # Pinterest's own link-unfurl crawler
    ~*redditbot           1;   # Reddit's link-unfurl crawler
    ~*SkypeUriPreview     1;   # Skype chat link-preview fetcher

    # Broader fallback, in addition to the named list above — added after a
    # real gap was found: a person validating this feature with a public,
    # no-login OG-tag checker (opengraph.xyz) got the plain SPA shell (no
    # meta/OG tags at all), because that tool's crawler isn't any of the
    # named strings above. Named social-platform crawlers are still listed
    # explicitly (documentation of exactly what's deliberately, verifiably
    # supported), but literally every UA on that list already lacks a
    # "Mozilla" token too — every real browser has included "Mozilla/5.0"
    # for legacy compatibility reasons for decades, while simple bots/
    # crawlers/OG-checker tools essentially never spoof a full browser UA.
    # This is the standard bot-vs-browser heuristic for exactly this
    # problem: it catches unknown/future preview tools without needing to
    # enumerate every one of them by name, at the cost of a real but very
    # rare regression if a genuine browser omitted "Mozilla" entirely. See
    # docs/server-setup-runbook.md for the incident this was added for.
    "~*^(?!.*Mozilla).*$" 1;

    # Explicit exact-match — nginx's `map` does NOT evaluate regex entries
    # against an empty source string at all (a real, confirmed quirk: an
    # absent/empty User-Agent header always falls through to `default`
    # regardless of any regex pattern that would otherwise match empty).
    # Confirmed by testing locally with a debug response header before
    # adding this line. No real browser sends an empty/absent UA.
    ""  1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No http {} block exists in this file (it's included into the base
    # nginx:alpine image's own nginx.conf as the single server block) — set
    # here rather than at http level, same as backend/docker/nginx.conf's
    # identical fix. Suppresses the version number from the "server" response
    # header (stays "nginx", drops the "/1.x.y" — nginx never fully removes
    # the header itself, only the version string). This is the primary
    # user-facing route (the SPA root), unlike the backend's API-only nginx —
    # missed here the first time server_tokens was applied.
    server_tokens off;

    # SPA fallback — any path react-router owns (e.g. /notes/5) must still
    # serve index.html, or a direct visit/refresh 404s at the nginx level
    # instead of reaching the client-side router. The dev Vite server does
    # this automatically; a static file server does not, by default.
    location / {
        # A single `rewrite ... last` is the one documented-safe use of `if`
        # in a location block (nginx's own pitfalls docs) — it restarts
        # location matching on a new URI rather than trying to merge/buffer
        # directives, so this can't affect the try_files line below for any
        # request that doesn't match the bot map.
        if ($is_bot_preview) {
            rewrite ^ /__bot-preview-dispatch last;
        }
        try_files $uri $uri/ /index.html;
    }

    # Internal-only — never reachable directly from outside, and never hit
    # except via the rewrite above. $request_uri always holds the ORIGINAL
    # client request URI (path + query string), unaffected by the internal
    # rewrite, so the real path reaches the backend with no regex-capture
    # juggling needed. frontend and backend are already on the same default
    # Compose network (frontend already depends_on: backend), so
    # `backend:8000` resolves with no additional networking changes.
    location = /__bot-preview-dispatch {
        internal;
        # Required because proxy_pass's target here includes a variable
        # ($request_uri) — nginx then resolves the hostname at REQUEST time,
        # not once at config load, and request-time resolution needs an
        # explicit resolver (it does NOT fall back to /etc/resolv.conf).
        # 127.0.0.11 is Docker's embedded DNS on every user-defined bridge
        # network — confirmed by testing this exact config locally: without
        # this line every bot request 502'd with "no resolver defined to
        # resolve backend" in the nginx error log.
        resolver 127.0.0.11 valid=10s;
        proxy_pass http://backend:8000/api/bot-preview$request_uri;
        # $http_host, not $host — $host silently strips a non-standard port
        # from the original request, which would only matter for a
        # non-default-port deployment, but there's no reason to introduce
        # the gap when the correct variable costs nothing.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NOT $scheme — nginx's own connection-level scheme here is always
        # "http" (Traefik terminates TLS and speaks plain HTTP to this
        # container internally). Forward the value Traefik already set on
        # its way in instead, or Laravel's trustProxies ends up building
        # "http://" canonical/og:url values on an https:// site.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
