server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No http {} block exists in this file (it's included into the base
    # nginx:alpine image's own nginx.conf as the single server block) — set
    # here rather than at http level, same as backend/docker/nginx.conf's
    # identical fix. Suppresses the version number from the "server" response
    # header (stays "nginx", drops the "/1.x.y" — nginx never fully removes
    # the header itself, only the version string). This is the primary
    # user-facing route (the SPA root), unlike the backend's API-only nginx —
    # missed here the first time server_tokens was applied.
    server_tokens off;

    # SPA fallback — any path react-router owns (e.g. /notes/5) must still
    # serve index.html, or a direct visit/refresh 404s at the nginx level
    # instead of reaching the client-side router. The dev Vite server does
    # this automatically; a static file server does not, by default.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
