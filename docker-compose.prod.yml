# Production stack. Not the same shape as docker-compose.yml (dev) on purpose
# — see docs/server-setup-runbook.md for why this is a separate file rather
# than an override.
#
# Usage (on the server, once deployed — NOT run by this repo automatically):
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Prerequisite this file can't enforce: ufw must allow 80/tcp and 443/tcp on
# the Droplet (only OpenSSH is allowed by default from initial hardening).
services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    command:
      - --providers.docker=true
      # Only containers explicitly labeled traefik.enable=true get routed —
      # nothing is exposed by accident as more services get added later.
      - --providers.docker.exposedByDefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      # Plain HTTP always redirects to HTTPS.
      - --entrypoints.web.http.redirections.entryPoint.to=websecure
      - --entrypoints.web.http.redirections.entryPoint.scheme=https
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      # File provider, alongside the Docker provider above — for config that
      # isn't naturally per-container (the security-headers middleware
      # applies to both backend and frontend routers), a labels-only approach
      # would mean duplicating the same header list onto both services.
      # watch=true picks up traefik/dynamic.yml edits without a container
      # restart, matching the Docker provider's own live-label-watching.
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
    ports:
      - '80:80'
      - '443:443'
    volumes:
      # Read-only: Traefik only needs to observe containers/labels, not
      # control them.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Named volume, not a bind-mount — Traefik creates acme.json itself
      # inside the container with correct 600 permissions on first run,
      # sidestepping the classic "chmod your acme.json" bind-mount gotcha.
      - traefik_certs:/letsencrypt
      # Read-only bind mount — unlike acme.json, this file is authored in the
      # repo, not generated by Traefik itself.
      - ./traefik/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME}
      APP_ENV: production
      APP_DEBUG: 'false'
      APP_URL: https://${DOMAIN}
      APP_KEY: ${APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      B2_IMAGES_KEY_ID: ${B2_IMAGES_KEY_ID}
      B2_IMAGES_APPLICATION_KEY: ${B2_IMAGES_APPLICATION_KEY}
      B2_IMAGES_BUCKET: ${B2_IMAGES_BUCKET}
      B2_IMAGES_BUCKET_ID: ${B2_IMAGES_BUCKET_ID}
      B2_IMAGES_REGION: ${B2_IMAGES_REGION}
      B2_IMAGES_ENDPOINT: ${B2_IMAGES_ENDPOINT}
      # This service's environment: block is an explicit per-var allowlist,
      # not a passthrough of everything in .env.production — a var missing
      # here is simply never seen by the container, regardless of what's set
      # in the env file. LOG_* previously wasn't listed at all, so config/
      # logging.php's env() calls always fell back to their own defaults
      # (which happen to still produce working debug-level logging) no
      # matter what .env.production said. Given sane defaults via Compose's
      # ${VAR:-default} syntax, so .env.production doesn't need to define
      # these unless you actually want to override one.
      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_STACK: ${LOG_STACK:-single}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_DEPRECATIONS_CHANNEL: ${LOG_DEPRECATIONS_CHANNEL:-null}
    volumes:
      # Named volume, not the image's writable layer — without this, every
      # `up -d --build`/`--force-recreate` (i.e. every deploy) silently wipes
      # storage/logs/laravel.log along with the rest of the old container.
      - backend_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    # No published port — only reachable through Traefik over the default
    # Compose network.
    labels:
      - traefik.enable=true
      - traefik.http.routers.backend.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      # Explicit priority on BOTH routers (see frontend below), not just this
      # one — Traefik uses higher-number-wins, and mixing one explicit value
      # with the other router's auto-computed (rule-string-length-based)
      # priority is exactly what caused a real production bug: 10 turned out
      # to be *lower* than frontend's auto-priority, so frontend matched
      # /api/* requests too and backend never saw them. Pinning both ends the
      # ambiguity instead of trying to guess which auto-computed value beats which.
      - traefik.http.routers.backend.priority=100
      - traefik.http.routers.backend.entrypoints=websecure
      - traefik.http.routers.backend.tls.certresolver=letsencrypt
      - traefik.http.services.backend.loadbalancer.server.port=8000
      # @file is required, not optional — this router is a Docker-provider
      # object (defined via these labels), and security-headers is defined
      # in the file provider (traefik/dynamic.yml); cross-provider references
      # must be namespaced or Traefik logs "middleware does not exist".
      - traefik.http.routers.backend.middlewares=security-headers@file

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        # Vite inlines VITE_* vars into the static bundle at build time, so
        # this has to be a build arg — setting it as a plain runtime
        # environment: value here would do nothing, there's no Node process
        # left at runtime to read it.
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - backend
    labels:
      - traefik.enable=true
      - traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.frontend.priority=1
      - traefik.http.routers.frontend.entrypoints=websecure
      - traefik.http.routers.frontend.tls.certresolver=letsencrypt
      - traefik.http.services.frontend.loadbalancer.server.port=80
      - traefik.http.routers.frontend.middlewares=security-headers@file

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    # Deliberately no ports: mapping — unlike dev, Postgres has no business
    # being reachable from the public internet, even password-protected.
    # Only the backend container can reach it, over the Docker network.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  traefik_certs:
  backend_logs:
